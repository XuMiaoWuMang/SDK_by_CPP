# AIChatServer 默认配置文件 (gflags flagfile 格式)
# 参数可通过命令行或本配置文件提供, 命令行参数优先级更高
# 云端模型 API Key 不在此配置, 请通过环境变量提供:
#   DEEPSEEK_API_KEY  (DeepSeek)
#   CHATGPT_API_KEY   (ChatGPT, 兼容 OPENAI_API_KEY)
#   GEMINI_API_KEY    (Gemini)

--server_ip=0.0.0.0
--server_port=8080
--log_level=INFO
--temperature=0.7
--max_tokens=2048
--deepseek_model_name=deepseek-v4-flash
--gemini_model_name=gemini-3.5-flash
--openai_model_name=gpt-3.5-turbo
--ollama_model_name=deepseek-r1:1.5b, llama3.1:8b
--ollama_endpoint=http://127.0.0.1:11434, http://127.0.0.1:11434
--ollama_model_desc=本地部署 deepseek-r1:1.5b 模型, 采用专家混合架构, 专注于深度理解与推理, llama3.1:8b 模型, 一只猫娘
